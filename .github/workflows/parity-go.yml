# PRICE-42 parity gate for the Go reimplementation (plan: docs/plans/PRICE-42-go.md).
name: parity-go
on:
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/parity-go.yml'
      - 'parity/**'
      - 'contracts/**'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/parity-go.yml'
      - 'parity/**'
      - 'contracts/**'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # contract.mjs imports the `yaml` package, so the oracle needs the root devDependencies.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: npm ci
        run: npm ci
      - name: go vet
        working-directory: go
        run: go vet ./...
      - name: go test
        working-directory: go
        run: go test ./...
      - name: build and start candidate
        working-directory: go
        run: |
          go build -o "$RUNNER_TEMP/pricing-go" .
          PORT=8090 nohup "$RUNNER_TEMP/pricing-go" > "$RUNNER_TEMP/pricing-go.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/catalog > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/pricing-go.log"
          exit 1
      # Oracle steps: one per command, each must exit 0. Final state since slice 5.
      - name: oracle check (all cases)
        run: node parity/check.mjs --base http://localhost:8090
      - name: oracle contract
        run: node parity/contract.mjs --base http://localhost:8090
      - name: oracle blackbox
        run: node parity/blackbox/run.mjs --base http://localhost:8090
